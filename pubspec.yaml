name: mobollama
description: A focused mobile agent client for Ollama.
publish_to: none
version: 1.3.0+5

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  flutter_markdown: ^0.7.7+1
  flutter_secure_storage: ^11.0.0
  http: ^1.6.0
  image_picker: ^1.2.3
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  sqflite: ^2.4.3
  url_launcher: ^6.3.2
  uuid: ^4.5.3
  flutter_svg: ^2.3.0
  markdown: ^7.3.1
  share_plus: ^13.3.0
  file_selector: ^1.1.0
  pdfrx: ^2.6.1
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0
  crypto: ^3.0.7
  re_highlight: ^0.0.3
  flutter_markdown_latex: ^0.3.4
  flutter_math_fork: ^0.7.4
  scroll_to_index: ^3.0.1
  package_info_plus: ^10.2.1
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/mobilellama-icon.png
    - assets/icons/
